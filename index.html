if(i===3&&!S.open4)h+='<p>Locked. Unlock it in Upgrades (RM 250).</p>';else{h+=`<p>${opOK(i)?'🟢 Open':'🔴 Closed / no staff'} · Staff: <b>${st?st.n:'none'}</b><br>Waiting: <b>${D.q[i].length}</b> · Now serving: <b>${D.now[i]}</b></p><p><select onchange="assignTo(${i},this.value,0)"><option value="-1">— no staff —</option>${S.staff.map((s,k)=>`<option value="${k}" ${s.c===i?'selected':''}>${s.n} (${s.r}, ×${s.sp})</option>`).join('')}</select></p><p><button class="b g" onclick="callNext(${i})">CALL NEXT</button> <button class="b w" onclick="toggleC(${i})">${D.open[i]?'Close':'Open'} counter</button></p>`;
if(cu&&cu.st==='at')h+=docCheck(cu,i);else if(cu&&cu.st==='proc')h+=`<p>Processing ${cu.tick} (${cu.sv.n})…</p><div class="bar"><i id="pg"></i></div>`;else if(cu)h+=`<p>${cu.tick} is walking over…</p>`}}
else if(sel.t==='s'){const s=S.staff[sel.i];h=`<button class="x" onclick="selNone()">✕</button><h3>${s.n}</h3><p>${s.r} · speed ×${(s.sp*(1+.15*S.pc)).toFixed(2)}<br>${s.c>=0?'At counter '+(s.c+1):'On break'} · served ${s.served}<br>Workload ${Math.min(100,s.busy/Math.max(1,D.el)*100|0)}%</p><button class="b w" onclick="staffM()">Manage staff</button>`}
else{const c=sel.c;h=`<button class="x" onclick="selNone()">✕</button><h3>${c.name} ${c.tick?'· '+c.tick:''}</h3><p>${c.sv.n} <small>(counter ${c.sv.c+1})</small><br>${ST[c.st]||''}<br>Fee RM${c.sv.f} <small>(game value)</small></p><p>Patience</p><div class="bar"><i id="pp"></i></div><p><small>Needs: ${c.sv.d.join(', ')}</small></p>`}
el.innerHTML=h}
const fmt=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60|0).padStart(2,'0');
function ui(){const w=D.q.reduce((a,q)=>a+q.length,0),aw=D.waits.length?D.waits.reduce((a,b)=>a+b)/D.waits.length:0,sat=D.samples.length?D.samples.reduce((a,b)=>a+b)/D.samples.length:100,act=[0,1,2,3].filter(opOK).length,eff=act&&D.el>1?Math.min(100,S.staff.reduce((a,s)=>a+(s.c>=0?s.busy:0),0)/(act*D.el)*100):0,tg=target();
const ch=(i,l,b,x)=>`<div class="ch p"><small>${i} ${l}</small><b>${b}</b>${x||''}</div>`;
$('#top').innerHTML=ch('📅','Day',S.day)+ch('🕗','Time',fmt(D.t))+ch('💰','Budget','RM '+S.money)+ch('✅','Served',D.served+' / '+tg,`<div class="bar"><i style="width:${Math.min(100,D.served/tg*100)}%"></i></div>`)+ch('🧍','Waiting',w)+ch('⏱','Avg wait',aw.toFixed(0)+'s')+ch('😊','Satisfaction',sat.toFixed(0)+'%',`<div class="bar"><i style="width:${sat}%;background:${sat>60?'var(--ok)':'var(--rd)'}"></i></div>`)+ch('🪪','Counters',act+' active')+ch('⚙','Efficiency',eff.toFixed(0)+'%');
$('#cs').innerHTML=[0,1,2,3].map(i=>{const cu=D.cur[i],lock=i===3&&!S.open4;return`<button class="cc ${sel&&sel.t==='c'&&sel.i===i?'sel':''} ${cu&&cu.st==='at'?'al':''}" onclick="selK(${i})"><b>${i+1} · ${CN[i].split(' ')[0]}</b><small>${lock?'🔒 Locked':(opOK(i)?'🟢':'🔴')+' '+D.now[i]+' · '+D.q[i].length+' waiting'}</small><small>${cu&&cu.st==='at'?'⚠ Check documents!':cu&&cu.st==='proc'?'Serving…':'&nbsp;'}</small></button>`}).join('');
$('#ql').innerHTML=[0,1,2,3].map(i=>`<div class="qh">${CL[i]} · ${CN[i]} (${D.q[i].length})</div>`+D.q[i].map(c=>`<span class="tk" onclick="selC(${c.id})">${c.tick}<i style="width:${Math.max(4,c.pat*.6)}%;background:${c.pat>60?'#2e9c6a':c.pat>30?'#f0ad4e':'#d23b3b'}"></i></span>`).join('')).join('');
lamps.forEach((l,i)=>l.material.color.setHex(i===3&&!S.open4?0x888888:!opOK(i)?0xd23b3b:D.cur[i]?0xf0ad4e:0x2e9c6a));
const sg=sel?[sel.t,sel.i,sel.c&&sel.c.st,D.now.join(),D.q.map(q=>q.length).join(),D.cur.map(c=>c&&c.st).join(),S.staff.map(s=>s.c).join(),D.open.join()].join('|'):'x';if(sg!==lastSig){lastSig=sg;card()}
if(sel&&sel.t==='c'&&D.cur[sel.i]&&D.cur[sel.i].st==='proc'){const e=$('#pg');if(e)e.style.width=Math.min(100,D.cur[sel.i].prog/need(D.cur[sel.i])*100)+'%'}
if(sel&&sel.t==='p'){const e=$('#pp');if(e){e.style.width=Math.max(0,sel.c.pat)+'%';e.style.background=sel.c.pat>60?'#2e9c6a':sel.c.pat>30?'#f0ad4e':'#d23b3b'}}
const sp=$('#sp'),x=sp.getContext('2d'),h=D.hist;x.clearRect(0,0,190,34);x.strokeStyle='#1f5fa8';x.lineWidth=2;x.beginPath();const mx=Math.max(5,...h);h.forEach((n,i)=>{const px=i*190/60,py=32-n/mx*28;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
if(D.dirty){qDisp.redraw();D.dirty=0}if(Math.floor(D.t)!==ui.m){ui.m=Math.floor(D.t);clk.redraw()}}
/* ---------- input ---------- */
const ptr=new Map(),keys={},rc=new THREE.Raycaster();let pd=0,mv=0;
const cv=$('#c');cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});mv=0;pd=0;if(ptr.size===2){const[a,b]=[...ptr.values()];pd=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;mv+=Math.abs(dx)+Math.abs(dy);if(ptr.size===1){cs.a-=dx*.005;cs.e+=dy*.005}else if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)cs.d*=pd/d;pd=d}setCam()});
cv.addEventListener('pointerup',e=>{if(mv<8&&ptr.size===1){const r=cv.getBoundingClientRect();rc.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-((e.clientY-r.top)/r.height)*2+1},cam);const own=h=>{let p=h.object;while(p&&!(p.userData&&p.userData.o))p=p.parent;return p&&p.userData.o};const hit=rc.intersectObjects(sc.children,true).find(h=>own(h));if(hit){const o=own(hit);sel=o.sv?{t:'p',c:o}:o;sfx.click()}else sel=null;lastSig=''}ptr.delete(e.pointerId);pd=0});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();cs.d*=1+Math.sign(e.deltaY)*.08;setCam()},{passive:false});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function pan(dt){const k=keys,dx=((k.d||k.arrowright)?1:0)-((k.a||k.arrowleft)?1:0),dz=((k.s||k.arrowdown)?1:0)-((k.w||k.arrowup)?1:0);if(dx||dz){cs.tx+=dx*dt*9;cs.tz+=dz*dt*9;setCam()}}
/* ---------- main loop ---------- */
let last=performance.now(),ux=0;
function loop(now){requestAnimationFrame(loop);try{const dt=Math.min(.05,(now-last)/1000);last=now;pan(dt);frame(dt);ux+=dt;if(ux>.25){ux=0;ui()}ren.render(sc,cam)}catch(e){console.error(e);if(e.message!==lastMsg){lastMsg=e.message;toast('Error: '+e.message)}}}
seats.forEach(s=>s.g.visible=s.col<S.cols);syncStaff();sObj.forEach((o,i)=>{const s=S.staff[i];o.g.position.set(s.c>=0?CX[s.c]:8.4+(i%3)*.65,0,s.c>=0?-6.2:-7.6);o.path=[]});
ui();$('#ld').style.display='none';requestAnimationFrame(loop);
let seen=false;try{seen=!!localStorage.getItem('jpn_tut')}catch(e){}
seen?intro():tut(0);
</script></body></html>
